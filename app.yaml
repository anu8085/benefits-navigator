command:
  - streamlit
  - run
  - app.py

env:
  - name: STREAMLIT_GATHER_USAGE_STATS
    value: "false"

  - name: DATABRICKS_SERVER_HOSTNAME
    value: "dbc-618d22b9-ae94.cloud.databricks.com"

  - name: DATABRICKS_HTTP_PATH
    value: "/sql/1.0/warehouses/d1ee87a13281e224"

  - name: ANTHROPIC_API_KEY
    valueFrom: anthropic-api-key

  - name: DATABRICKS_TOKEN
    valueFrom: databricks-token

  - name: LAKEBASE_DATABASE
    value: "databricks_postgres"

  - name: LAKEBASE_PORT
    value: "5432"

  # Databricks App Lakebase database resource (resource key: lakebase-db).
  # Inside Databricks Apps this is injected so the app authenticates with
  # Databricks-managed credentials (short-lived OAuth token) instead of a
  # manually copied LAKEBASE_PASSWORD. Locally this var is simply absent and
  # lakebase_client.py falls back to manual LAKEBASE_* credentials.
  - name: LAKEBASE_RESOURCE
    valueFrom: lakebase-db